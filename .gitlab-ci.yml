# Use a lightweight Node image
image: node:22

# Define cache and cleanup to avoid disk overuse
cache:
  paths:
    - node_modules/

pages:
  before_script:
    - npm cache clean --force
    - rm -rf /root/.cache || true
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
