# Use a lightweight Node image
image: node:22

# Cache downloaded packages: npm ci removes node_modules on every run.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

pages:
  # iGEM's shared runners occasionally drop mid-job ("Job failed (system failure)").
  # Auto-retry ONLY on runner/infrastructure failures — never on real build errors.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
